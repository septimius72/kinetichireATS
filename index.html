<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KineticHire ATS - The Smart Recruitment Suite</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-subtle: #eff6ff;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-subtle: #fef2f2;
      --success: #10b981;
      --success-subtle: #ecfdf5;
      --warning: #f59e0b;
      --warning-subtle: #fffbeb;
      --star-color: #f59e0b;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body.dark-mode {
      --bg-main: #0b1120;
      --bg-surface: #131d33;
      --bg-card: #192542;
      --bg-subtle: #1e2b4d;
      --border-subtle: #23345a;
      --border-strong: #334b7d;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-subtle: #1e3a8a44;
      --danger: #f87171;
      --danger-hover: #ef4444;
      --danger-subtle: #7f1d1d44;
      --success: #34d399;
      --success-subtle: #064e3b44;
      --warning: #fbbf24;
      --warning-subtle: #78350f44;
      --star-color: #fbbf24;
      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.3);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.65rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
      user-select: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.15rem;
      white-space: nowrap;
    }

    .brand-badge {
      background: var(--primary);
      color: #ffffff;
      padding: 0.2rem 0.45rem;
      border-radius: var(--radius-sm);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .search-wrapper {
      flex: 1;
      max-width: 360px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.45rem 0.75rem 0.45rem 2.1rem;
      font-size: 0.85rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      color: var(--text-main);
      outline: none;
      transition: all 0.15s ease;
    }

    .search-input:focus {
      background: var(--bg-surface);
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.75rem;
      font-size: 0.825rem;
      font-weight: 500;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      background: var(--bg-surface);
      color: var(--text-main);
      white-space: nowrap;
      transition: all 0.15s ease;
      user-select: none;
      text-decoration: none;
    }

    .btn:hover { background: var(--bg-subtle); border-color: var(--border-strong); }
    .btn-icon-only { padding: 0.45rem 0.55rem; }
    .btn-primary { background: var(--primary); color: #ffffff; border: none; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { border: 1px solid var(--border-strong); }
    .btn-danger { background: var(--danger-subtle); color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #ffffff; }

    .btn-pill-action {
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn-advance { background: var(--success-subtle); color: var(--success); border: 1px solid var(--success); }
    .btn-advance:hover { background: var(--success); color: #ffffff; }
    .btn-reject { background: var(--danger-subtle); color: var(--danger); border: 1px solid var(--danger); }
    .btn-reject:hover { background: var(--danger); color: #ffffff; }
    .btn-email { background: var(--primary-subtle); color: var(--primary); border: 1px solid var(--primary); }
    .btn-email:hover { background: var(--primary); color: #ffffff; }

    .hotkey-badge {
      display: inline-block;
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      font-size: 0.65rem;
      font-family: monospace;
      font-weight: 700;
      background: var(--bg-subtle);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      margin-left: 0.2rem;
    }

    #analyticsDrawer {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      transition: max-height 0.25s ease, padding 0.25s ease;
      max-height: 0;
      overflow: hidden;
      flex-shrink: 0;
    }

    #analyticsDrawer.open {
      max-height: 290px;
      padding: 0.85rem 1.25rem;
    }

    .analytics-inner {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .analytics-top {
      display: flex;
      gap: 1.5rem;
      height: 160px;
      align-items: center;
    }

    .chart-container { flex: 1; height: 100%; position: relative; }

    .stats-pills {
      width: 250px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .stat-pill {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.5rem;
    }

    .stat-pill span { display: block; font-size: 0.68rem; color: var(--text-muted); }
    .stat-pill strong { font-size: 1.15rem; color: var(--text-main); }

    .funnel-velocity-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      padding-top: 0.25rem;
      border-top: 1px solid var(--border-subtle);
    }

    .funnel-step {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .funnel-badge {
      background: var(--primary-subtle);
      color: var(--primary);
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }

    .funnel-arrow { color: var(--text-muted); font-size: 0.8rem; }

    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .list-pane {
      width: 440px;
      min-width: 300px;
      max-width: 700px;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .pane-divider {
      width: 6px;
      cursor: col-resize;
      background: var(--border-subtle);
      transition: background 0.15s ease;
      z-index: 10;
      flex-shrink: 0;
    }

    .pane-divider:hover, .pane-divider.dragging {
      background: var(--primary);
    }

    .list-filter-bar {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      background: var(--bg-subtle);
    }

    .select-control {
      padding: 0.35rem 0.5rem;
      font-size: 0.78rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      outline: none;
      background: var(--bg-surface);
      color: var(--text-main);
    }

    .candidate-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .candidate-row {
      padding: 0.65rem 0.8rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      transition: all 0.15s ease;
    }

    .candidate-row:hover { background: var(--bg-subtle); border-color: var(--border-strong); }
    .candidate-row.selected { background: var(--primary-subtle); border-color: var(--primary); }

    .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
    .row-name { font-weight: 600; font-size: 0.88rem; color: var(--text-main); }

    .stalled-flag {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      background: var(--warning-subtle);
      color: var(--warning);
      border: 1px solid var(--warning);
      font-size: 0.65rem;
      padding: 0.05rem 0.35rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .stalled-danger {
      background: var(--danger-subtle);
      color: var(--danger);
      border-color: var(--danger);
    }

    .row-sub { display: flex; justify-content: space-between; align-items: center; }
    .row-role { font-size: 0.76rem; color: var(--text-muted); }
    .card-stars { color: var(--star-color); font-size: 0.72rem; letter-spacing: 1px; }

    .row-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 0.15rem; gap: 0.5rem; }
    .row-tags { display: flex; gap: 0.25rem; flex-wrap: wrap; }
    .badge-tag { font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: var(--radius-sm); background: var(--bg-subtle); border: 1px solid var(--border-subtle); color: var(--text-muted); }
    .row-stage-tag { font-size: 0.65rem; font-weight: 600; padding: 0.12rem 0.45rem; border-radius: 999px; letter-spacing: 0.02em; white-space: nowrap; }

    .detail-pane {
      flex: 1;
      background: var(--bg-main);
      overflow-y: auto;
      padding: 1.25rem 1.75rem;
      display: flex;
      justify-content: center;
    }

    .detail-card {
      width: 100%;
      max-width: 880px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      height: fit-content;
    }

    .detail-header {
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .detail-title h2 { font-size: 1.25rem; font-weight: 700; }
    .detail-title p { font-size: 0.8rem; color: var(--text-muted); }
    .header-quick-actions { display: flex; align-items: center; gap: 0.4rem; }

    .detail-body {
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .field-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .field-group label { font-size: 0.775rem; font-weight: 600; color: var(--text-main); }

    .field-group input, .field-group select, .field-group textarea {
      padding: 0.5rem 0.7rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--bg-subtle);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .field-group input:focus, .field-group select:focus, .field-group textarea:focus {
      background: var(--bg-surface);
      border-color: var(--primary);
    }

    .field-group textarea { min-height: 85px; resize: vertical; }

    .scorecard-panel {
      border: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
      padding: 0.75rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }

    .scorecard-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .scorecard-item label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .score-stars-row {
      display: flex;
      gap: 0.15rem;
      cursor: pointer;
      user-select: none;
    }

    .score-star { font-size: 0.95rem; color: var(--border-strong); transition: color 0.1s; }
    .score-star.active { color: var(--star-color); }

    .links-file-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
    }

    .link-input-wrap {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-icon-link {
      padding: 0.45rem 0.6rem;
      font-size: 0.75rem;
      border-radius: var(--radius-md);
    }

    .resume-upload-box {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.45rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      min-height: 40px;
      align-items: center;
    }

    .interactive-tag {
      background: var(--primary-subtle);
      color: var(--primary);
      border: 1px solid var(--primary);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .interactive-tag .remove-tag { cursor: pointer; font-weight: bold; }

    .tag-input-inline {
      border: none !important;
      background: transparent !important;
      outline: none !important;
      padding: 0.2rem !important;
      font-size: 0.8rem !important;
      flex: 1;
      min-width: 140px;
    }

    .notes-tabs-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .notes-tab-btn {
      font-size: 0.72rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      padding: 0.2rem 0.4rem;
      border-radius: var(--radius-sm);
    }

    .notes-tab-btn.active {
      background: var(--bg-subtle);
      color: var(--primary);
    }

    .markdown-preview-pane {
      min-height: 85px;
      padding: 0.5rem 0.7rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      font-size: 0.85rem;
      overflow-y: auto;
    }

    .markdown-preview-pane ul { padding-left: 1.2rem; }
    .markdown-preview-pane strong { font-weight: 700; color: var(--text-main); }
    .markdown-preview-pane em { font-style: italic; }

    .history-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.75rem;
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.75rem;
    }

    .history-row { display: flex; justify-content: space-between; padding-bottom: 0.25rem; border-bottom: 1px solid var(--border-subtle); color: var(--text-muted); }

    .detail-footer {
      padding: 0.9rem 1.4rem;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom-left-radius: var(--radius-lg);
      border-bottom-right-radius: var(--radius-lg);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      gap: 0.75rem;
      user-select: none;
    }

    .save-indicator {
      font-size: 0.725rem;
      color: var(--success);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .save-indicator.visible { opacity: 1; }

    .modal-backdrop {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.open { opacity: 1; pointer-events: auto; }

    .modal-card {
      width: 90%;
      max-width: 620px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.96);
      transition: transform 0.2s ease;
    }

    .modal-backdrop.open .modal-card { transform: scale(1); }

    .modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 72vh;
      overflow-y: auto;
    }

    .template-selector-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .template-tab-btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-muted);
      cursor: pointer;
    }

    .template-tab-btn.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }

    .modal-footer {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hidden { display: none !important; }

    body:not(.dark-mode) .stage-c0 { background: #f1f5f9; color: #475569; }
    body:not(.dark-mode) .stage-c1 { background: #e0f2fe; color: #0369a1; }
    body:not(.dark-mode) .stage-c2 { background: #ccfbf1; color: #0f766e; }
    body:not(.dark-mode) .stage-c3 { background: #fef3c7; color: #b45309; }
    body:not(.dark-mode) .stage-c4 { background: #fef9c3; color: #a16207; }
    body:not(.dark-mode) .stage-c5 { background: #e0e7ff; color: #4338ca; }
    body:not(.dark-mode) .stage-c6 { background: #ede9fe; color: #6d28d9; }
    body:not(.dark-mode) .stage-c7 { background: #fce7f3; color: #be185d; }
    body:not(.dark-mode) .stage-c8 { background: #dcfce7; color: #15803d; }
    body:not(.dark-mode) .stage-c9 { background: #d1fae5; color: #047857; }
    body:not(.dark-mode) .stage-crejected { background: #fee2e2; color: #b91c1c; }

    body.dark-mode .stage-c0 { background: #1e293b; color: #94a3b8; }
    body.dark-mode .stage-c1 { background: #0c4a6e; color: #7dd3fc; }
    body.dark-mode .stage-c2 { background: #134e4a; color: #5eead4; }
    body.dark-mode .stage-c3 { background: #78350f; color: #fde68a; }
    body.dark-mode .stage-c4 { background: #713f12; color: #fef08a; }
    body.dark-mode .stage-c5 { background: #312e81; color: #a5b4fc; }
    body.dark-mode .stage-c6 { background: #4c1d95; color: #c4b5fd; }
    body.dark-mode .stage-c7 { background: #831843; color: #f9a8d4; }
    body.dark-mode .stage-c8 { background: #14532d; color: #86efac; }
    body.dark-mode .stage-c9 { background: #064e3b; color: #6ee7b7; }
    body.dark-mode .stage-crejected { background: #450a0a; color: #fca5a5; }

    @media (max-width: 900px) {
      .workspace { flex-direction: column; }
      .list-pane { width: 100% !important; max-width: none; height: 42vh; }
      .pane-divider { display: none; }
      .detail-pane { padding: 1rem; }
      .scorecard-panel { grid-template-columns: 1fr 1fr; }
      .links-file-row { grid-template-columns: 1fr; }

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      if (!isSoundEnabled) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        if (type === 'select') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.04);
        } else if (type === 'save' || type === 'advance') {
          [ { freq: 523.25, time: 0 }, { freq: 659.25, time: 0.07 } ].forEach(tone => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(tone.freq, now + tone.time);
            gain.gain.setValueAtTime(0.1, now + tone.time);
            gain.gain.exponentialRampToValueAtTime(0.001, now + tone.time + 0.14);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + tone.time); osc.stop(now + tone.time + 0.15);
          });
        } else if (type === 'delete' || type === 'reject') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(90, now + 0.18);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.18);
        }
      } catch (e) {}
    }

    function getNowFormatted() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function sanitize(val) {
      if (!val) return '';
      return String(val).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function calculateDaysInCurrentStage(candidate) {
      if (!candidate.history || candidate.history.length === 0) {
        const added = new Date(candidate.dateAdded || Date.now());
        return Math.max(0, Math.floor((Date.now() - added.getTime()) / (1000 * 60 * 60 * 24)));
      }
      const lastEntry = candidate.history[candidate.history.length - 1];
      const stageDate = new Date(lastEntry.timestamp.replace(' ', 'T'));
      if (isNaN(stageDate.getTime())) return 0;
      return Math.max(0, Math.floor((Date.now() - stageDate.getTime()) / (1000 * 60 * 60 * 24)));
    }

    function calculateCompositeScore(scorecard) {
      if (!scorecard) return 0;
      const scores = [scorecard.tech || 0, scorecard.comm || 0, scorecard.domain || 0, scorecard.culture || 0];
      const valid = scores.filter(s => s > 0);
      if (valid.length === 0) return 0;
      const sum = valid.reduce((a, b) => a + b, 0);
      return Number((sum / valid.length).toFixed(1));
    }

    function renderMarkdown(text) {
      if (!text) return '<p style="color:var(--text-muted)">No notes logged.</p>';
      let html = sanitize(text);
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/^- (.*)$/gim, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
      html = html.replace(/\n\n/g, '<br><br>');
      return html;
    }

    function renderList() {
      const container = document.getElementById('candidateListContainer');
      container.innerHTML = '';

      const query = searchQuery.trim().toLowerCase();
      let filtered = candidates.filter(cand => {
        const matchesStage = stageFilter === "ALL" || cand.stage === stageFilter;
        if (!matchesStage) return false;
        if (!query) return true;
        const inTags = (cand.tags || []).some(t => t.toLowerCase().includes(query));
        return (
          cand.name.toLowerCase().includes(query) ||
          cand.role.toLowerCase().includes(query) ||
          (cand.notes && cand.notes.toLowerCase().includes(query)) ||
          inTags
        );
      });

      filtered.sort((a, b) => {
        if (sortBy === 'rating_desc') {
          return calculateCompositeScore(b.scorecard) - calculateCompositeScore(a.scorecard);
        } else if (sortBy === 'name_asc') {
          return a.name.localeCompare(b.name);
        } else if (sortBy === 'stalled_desc') {
          return calculateDaysInCurrentStage(b) - calculateDaysInCurrentStage(a);
        } else {
          return new Date(b.dateAdded || 0) - new Date(a.dateAdded || 0);
        }
      });

      filtered.forEach(cand => {
        const stageObj = STAGES.find(s => s.id === cand.stage) || STAGES[0];
        const row = document.createElement('div');
        row.className = `candidate-row ${cand.id === selectedCandidateId ? 'selected' : ''}`;
        row.dataset.id = cand.id;

        const days = calculateDaysInCurrentStage(cand);
        let stalledBadge = '';
        if (cand.stage !== 'rejected' && cand.stage !== 'offer' && cand.stage !== 'background') {
          if (days >= 10) {
            stalledBadge = `<span class="stalled-flag stalled-danger">⚠️ ${days}d stalled</span>`;
          } else if (days >= 7) {
            stalledBadge = `<span class="stalled-flag">⏱ ${days}d in stage</span>`;
          }
        }

        const compScore = calculateCompositeScore(cand.scorecard);
        const starDisplay = '★'.repeat(Math.round(compScore)) + '☆'.repeat(5 - Math.round(compScore));
        const tagBadges = (cand.tags || []).slice(0, 3).map(t => `<span class="badge-tag">${sanitize(t)}</span>`).join('');

        row.innerHTML = `
          <div class="row-top">
            <span class="row-name">${sanitize(cand.name)}</span>
            ${stalledBadge || `<span class="row-date">${sanitize(cand.dateAdded)}</span>`}
          </div>
          <div class="row-sub">
            <span class="row-role">${sanitize(cand.role)}</span>
            <span class="card-stars" title="${compScore} of 5.0 stars">${starDisplay}</span>
          </div>
          <div class="row-bottom">
            <div class="row-tags">${tagBadges}</div>
            <span class="row-stage-tag ${stageObj.colorClass}">${stageObj.name}</span>
          </div>
        `;

        row.addEventListener('click', () => selectCandidate(cand.id));
        container.appendChild(row);
      });

      updateAnalytics();
    }

      document.getElementById('inputNotes').value = cand.notes || '';

      renderScorecardUI();

      activeResume = { name: cand.resumeName || '', data: cand.resumeData || '' };

      activeTags = [...(cand.tags || [])];
      renderTagPills();

          item.innerHTML = `<span>${sanitize(h.text)}</span><span>${sanitize(h.timestamp)}</span>`;
          logContainer.appendChild(item);
        });

      }

      const btnAdvance = document.getElementById('btnAdvanceStage');
      const btnReject = document.getElementById('btnRejectStage');
      const currentIdx = STAGES.findIndex(s => s.id === cand.stage);

      btnAdvance.disabled = (cand.stage === 'rejected' || currentIdx >= 9);
      btnAdvance.style.opacity = btnAdvance.disabled ? '0.5' : '1';

      btnReject.disabled = (cand.stage === 'rejected');

    function advanceCandidate() {
      if (!selectedCandidateId) return;
      const cand = candidates.find(c => c.id === selectedCandidateId);
      if (!cand) return;
      const currentIdx = STAGES.findIndex(s => s.id === cand.stage);
      if (currentIdx < 0 || currentIdx >= 9 || cand.stage === 'rejected') return;

      const nextStage = STAGES[currentIdx + 1];
      cand.stage = nextStage.id;
      if (!cand.history) cand.history = [];
      cand.history.push({ timestamp: getNowFormatted(), text: `Advanced to ${nextStage.name}` });

      playSound('advance');
      triggerSaveState();
      selectCandidate(cand.id);
    }

    function rejectCandidate() {
      if (!selectedCandidateId) return;
      const cand = candidates.find(c => c.id === selectedCandidateId);
      if (!cand || cand.stage === 'rejected') return;

      if (confirm(`Mark ${cand.name} as Rejected?`)) {
        cand.stage = 'rejected';
        if (!cand.history) cand.history = [];
        cand.history.push({ timestamp: getNowFormatted(), text: `Application status set to Rejected` });
        playSound('reject');
        triggerSaveState();
        selectCandidate(cand.id);
      }
    }

        return;
      }
      const visible = Array.from(document.querySelectorAll('.candidate-row'));
      const currIdx = visible.findIndex(r => r.dataset.id === selectedCandidateId);

      if (e.key === 'j' || e.key === 'ArrowDown') {
        e.preventDefault();
        if (visible.length === 0) return;
        const nextIdx = currIdx < visible.length - 1 ? currIdx + 1 : 0;
        selectCandidate(visible[nextIdx].dataset.id);
      } else if (e.key === 'k' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (visible.length === 0) return;
        const prevIdx = currIdx > 0 ? currIdx - 1 : visible.length - 1;
        selectCandidate(visible[prevIdx].dataset.id);
      } else if (e.key === 'a') {
        e.preventDefault(); advanceCandidate();

        e.preventDefault(); rejectCandidate();
      } else if (e.key === 'e') {

          labels: STAGES.map(s => s.name),
          datasets: [{
            data: new Array(STAGES.length).fill(0),
            backgroundColor: [
              '#64748b', '#0284c7', '#0d9488', '#d97706', '#ca8a04',
              '#6366f1', '#8b5cf6', '#ec4899', '#10b981', '#059669', '#ef4444'
            ],
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0, color: isDark ? '#94a3b8' : '#64748b' }, grid: { color: isDark ? '#23345a' : '#e2e8f0' } },
            x: { ticks: { font: { size: 9 }, maxRotation: 30, color: isDark ? '#94a3b8' : '#64748b' }, grid: { display: false } }
          }
        }
      });
    }

    function updateAnalytics() {
      const counts = STAGES.map(st => candidates.filter(c => c.stage === st.id).length);
      if (chartInstance) {
        chartInstance.data.datasets[0].data = counts;
        chartInstance.update();
      }

      const activeCandidates = candidates.filter(c => c.stage !== 'rejected');
      document.getElementById('statTotal').textContent = activeCandidates.length;

      const stalledCandidates = candidates.filter(c => c.stage !== 'rejected' && c.stage !== 'offer' && calculateDaysInCurrentStage(c) >= 7);
      document.getElementById('statStalled').textContent = stalledCandidates.length;
      document.getElementById('statOffers').textContent = candidates.filter(c => c.stage === 'offer').length;

      if (activeCandidates.length > 0) {
        const totalDays = activeCandidates.reduce((acc, c) => acc + calculateDaysInCurrentStage(c), 0);
        document.getElementById('statAvgDays').textContent = `${Math.round(totalDays / activeCandidates.length)}d`;
      } else {
        document.getElementById('statAvgDays').textContent = '0d';
      }

      // Funnel Conversion Velocity Pipeline
      const funnelContainer = document.getElementById('funnelVelocityBar');
      funnelContainer.innerHTML = '';
      for (let i = 0; i < STAGES.length - 2; i++) {
        const currentCount = counts[i];
        const nextCount = counts[i + 1];
        const convRate = currentCount > 0 ? Math.round((nextCount / currentCount) * 100) : 0;

        const step = document.createElement('div');
        step.className = 'funnel-step';
        step.innerHTML = `
          <span>${STAGES[i].name}</span>
          <span class="funnel-badge">${convRate}%</span>
          <span class="funnel-arrow">→</span>
        `;
        funnelContainer.appendChild(step);
      }
    }

    function exportCsv() {
      if (candidates.length === 0) return alert('No candidates to export.');
      playSound('select');
      const headers = ["ID", "Name", "Role", "Email", "Phone", "Stage", "Days in Stage", "Composite Rating", "Tags", "LinkedIn", "Portfolio", "Notes"];
      const rows = candidates.map(c => [
        `"${c.id}"`,
        `"${c.name.replace(/"/g, '""')}"`,
        `"${c.role.replace(/"/g, '""')}"`,
        `"${(c.email || '').replace(/"/g, '""')}"`,
        `"${(c.phone || '').replace(/"/g, '""')}"`,
        `"${(STAGES.find(s => s.id === c.stage) || {}).name || c.stage}"`,
        `"${calculateDaysInCurrentStage(c)}"`,
        `"${calculateCompositeScore(c.scorecard)}"`,
        `"${(c.tags || []).join(', ')}"`,
        `"${c.linkedin || ''}"`,
        `"${c.portfolio || ''}"`,
        `"${(c.notes || '').replace(/"/g, '""')}"`
      ].join(","));

      const blob = new Blob([headers.join(",") + "\n" + rows.join("\n")], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ats_candidates_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    function saveState() {
      playSound('save');
      const blob = new Blob([JSON.stringify(candidates, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ats_state_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function loadState(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (Array.isArray(parsed)) {
            candidates = parsed;
            triggerSaveState();
            selectCandidate(null);
            renderList();
            playSound('save');
          }
        } catch (err) {
          alert('Could not parse JSON state file.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadInitialData();
      initTheme();
      initAudio();
      setupDropdowns();
      setupChart();
      renderList();

      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderList();
      });

      document.getElementById('stageFilterSelect').addEventListener('change', (e) => {
        stageFilter = e.target.value;
        renderList();
      });

      document.getElementById('sortSelect').addEventListener('change', (e) => {
        sortBy = e.target.value;
        renderList();
      });

      document.getElementById('newCandidateBtn').addEventListener('click', prepareNewCandidate);
      document.getElementById('saveJsonBtn').addEventListener('click', saveState);
      document.getElementById('loadJsonInput').addEventListener('change', loadState);
      document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);

      document.getElementById('toggleAnalyticsBtn').addEventListener('click', () => {
        playSound('select');
        const drawer = document.getElementById('analyticsDrawer');
        drawer.classList.toggle('open');
        if (drawer.classList.contains('open') && chartInstance) {
          chartInstance.resize();
        }
      });
    });
  </script>
</body>
</html>
